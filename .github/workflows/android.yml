name: Build & Release Suzuki Defender OS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # pushing a tag like v1.0.0 creates a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write           # needed to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SuzukiDefenderOS-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuzukiDefenderOS-debug.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuzukiDefenderOS-apk
          path: dist/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true